<svg fill="none" viewBox="0 0 600 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .text { font-family: 'Fira Code', 'Cascadia Code', monospace, sans-serif; font-size: 14px; }
    
    .user { fill: #a5d6ff; font-weight: bold; }
    .host { fill: #79c0ff; }
    .dir { fill: #d2a8ff; }
    .cmd { fill: #f0883e; }
    .output { fill: #c9d1d9; }
    .folder { fill: #79c0ff; font-weight: bold; }

    /* Animação de aparição rápida */
    .line { opacity: 0; animation: fadeIn 0.1s forwards; }
    .l1 { animation-delay: 0.2s; }
    .l2 { animation-delay: 0.7s; }
    .l3 { animation-delay: 1.2s; }
    .l4 { animation-delay: 1.7s; }
    .l5 { animation-delay: 2.1s; }

    .cursor { fill: #58a6ff; animation: blink 0.8s infinite; }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Fundo do Terminal -->
  <rect class="bg" width="598" height="238" x="1" y="1" rx="8" />

  <!-- Botões de Janela (macOS) -->
  <circle class="dot-red" cx="24" cy="24" r="6" />
  <circle class="dot-yellow" cx="44" cy="24" r="6" />
  <circle class="dot-green" cx="64" cy="24" r="6" />

  <!-- Conteúdo do Terminal -->
  <g transform="translate(20, 64)" class="text">
    <!-- Linha 1 -->
    <g class="line l1">
      <text y="0">
        <tspan class="user">luizsa190406</tspan><tspan class="host">@earth</tspan>:<tspan class="dir">~</tspan>$ <tspan class="cmd">whoami</tspan>
      </text>
    </g>

    <!-- Linha 2 -->
    <g class="line l2">
      <text y="26" class="output">IT Intern @ Unicamp</text>
    </g>

    <!-- Linha 3 -->
    <g class="line l3">
      <text y="60">
        <tspan class="user">luizsa190406</tspan><tspan class="host">@earth</tspan>:<tspan class="dir">~</tspan>$ <tspan class="cmd">ls ~/research</tspan>
      </text>
    </g>

    <!-- Linha 4 -->
    <g class="line l4">
      <text y="86">
        <tspan class="folder">red-team/</tspan>  <tspan class="folder">ai-sec/</tspan>  <tspan class="folder">privacy/</tspan>
      </text>
    </g>

    <!-- Linha 5 -->
    <g class="line l5">
      <text y="120">
        <tspan class="user">luizsa190406</tspan><tspan class="host">@earth</tspan>:<tspan class="dir">~</tspan>$ 
      </text>
      <rect class="cursor" x="182" y="107" width="8" height="15" />
    </g>
  </g>
</svg>
